name = "ivy-blog-bot"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "IVY_KV"
id = "9dfd92f4487a4c0aa6114b60b5c9127b"

[[d1_databases]]
binding = "IVY_DB"
database_name = "ivy-blog-bot"
database_id = "9d3bfed4-e4af-446c-85aa-0011fcab103f"

# ── Browser automation (Cloudflare Browser Run, PAID usage-based) ──────────
[browser]
binding = "BROWSER"

# ── Self service binding ───────────────────────────────────────────────────
# The ONLY reliable way to re-enter this worker with a fresh waitUntil budget
# (split-and-continue). A plain fetch() to our own workers.dev route is not
# routed back and silently stalls — see fireContinuation() in src/index.ts.
[[services]]
binding = "SELF"
service = "ivy-blog-bot"

[triggers]
crons = ["* * * * *"]

[vars]
WORKER_URL = "https://ivy-blog-bot.priyamolmpraveen2.workers.dev"
