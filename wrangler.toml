name = "ivy-blog-bot"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "IVY_KV"
id = "9dfd92f4487a4c0aa6114b60b5c9127b"

[[d1_databases]]
binding = "IVY_DB"
database_name = "ivy-blog-bot"
database_id = "9d3bfed4-e4af-446c-85aa-0011fcab103f"

# ── Browser automation (Cloudflare Browser Run, PAID usage-based) ──────────
# browse_url / screenshot_url tools degrade gracefully ("not enabled") until
# this binding exists. To enable:
#   1. Enable "Browser Run" on the account (dashboard, usage-based billing)
#   2. Uncomment the block below and `wrangler deploy`
# Chromium only — Camoufox/Firefox forks are NOT supported by Browser Run.
# [browser]
# binding = "BROWSER"

[triggers]
crons = ["* * * * *"]

[vars]
DISCORD_APP_ID = "1521363304579338330"
DISCORD_PUBLIC_KEY = "ccf47e87e294ed5440b46b2dc3c10ab1ba3a6c121627f46e2a666bce8ffcd22b"
